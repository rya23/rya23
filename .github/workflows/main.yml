name: Update README cards

on:
    schedule:
        - cron: "0 0 * * *"
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Generate stats card
              uses: readme-tools/github-readme-stats-action@v1
              with:
                  card: stats
                  options: username=rya23&show_icons=true
                  path: profile/stats.svg
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Generate top languages card
              uses: readme-tools/github-readme-stats-action@v1
              with:
                  card: top-langs
                  options: username=rya23&layout=compact&langs_count=6
                  path: profile/top-langs.svg
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Generate MatryoshkaSearch pin
              uses: readme-tools/github-readme-stats-action@v1
              with:
                  card: pin
                  options: username=rya23&repo=MatryoshkaSearch
                  path: profile/MatryoshkaSearch.svg
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Generate CollabNext pin
              uses: readme-tools/github-readme-stats-action@v1
              with:
                  card: pin
                  options: username=rya23&repo=CollabNext
                  path: profile/CollabNext.svg
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Commit changes
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  git add profile/*.svg

                  if [[ -n $(git status --porcelain) ]]; then
                    git commit -m "chore: update README stats cards"
                    git pull --rebase
                    git push
                  fi
